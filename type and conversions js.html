<!DOCTYPE html>

<body>
    <script>
        //use of typeof operator
        let name = "john";
        let num = 5;
        let x;

        document.write(typeof (name));
        document.write("<br>");
        document.write(typeof (num));
        document.write("<br>");
        document.write(typeof (x));
        document.write("<br>");

        //use of String()
        //string() is a method which changes your data type into string

        let a = 4;
        let b = 5;

        document.write(a + b);
        document.write("<br>");
        document.write(String(a) + String(b)); // Do not add because it is a string it concatenates
        document.write("<br>");

        //use of search()
        let sentence = "Fall in love with coding.";
        document.write(sentence.search("in"));
        document.write("<br>");
    </script>
</body>

</html>
