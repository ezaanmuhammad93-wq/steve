<!DOCTYPE html>
<head>
        <title>Area Calculator</title>
</head>
<body>
        <script>
            var choice = prompt("Choose a shape to calculate the perimeter: \n1. rectangle \n2. triangle");
                if(choice == "1") {
                    var L = prompt("enter lenght:");
                    var B = prompt("enter breadth:");
                    var result = (2 * (number(L) + number(B)));
                    alert("The perimeter of the rectangle is: " + result);
                }

                if(choice == "2") {
                    var A = prompt("enter side A:");
                    var B = prompt("enter side B:");
                    var C = prompt("enter side C:");
                    var result = (number(A) + number(B) + number(C));
                    alert("The perimeter of the triangle is: " + result);
                }

                        
                
                        
        </script>
</body>
