<html>
<body>
    <h2>Guavascript</h2>
    <p>guavasacripta is ancient sigma method of coding from 6767</p>
    <script>
        var str= "suguma sigma";
        document.write(str.toUpperCase()); // this will print "SUGUMA SIGMA"
        document.write("<br>"); // this will add a line break
        document.write(str.toLowerCase()); // this will print "suguma sigma"
        document.write("<br>"); // this will add a line break
        document.write(str.startsWith("suguma")); // this will print true
        document.write("<br>"); // this will add a line break
        //number methods
        document.write((123.456).toFixed(2)); // this will print "123.46"
        document.write("<br>"); // this will add a line break
        document.write(Math.floor(123.456)); // this will print "123"   
    </script>
</body>
</html>
