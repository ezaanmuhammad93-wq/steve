<!DOCTYPE html>
<html>
    <head>
        <style>
                div{
                    right: 30px;
                    border: 3px salmon;
                }
                div.absolute{
                    position: absolute;
                    left: 50px;
                    border: 3px solid rgb(255, 135, 61);
                }
                div.relative{
                    position: relative;
                    left: 100px;
                    border: 3px solid rgb(255, 98, 0);
                }
                div.fixed{
                    position: fixed;
                    top: 0px;
                    right: 20px;
                    width: 300px;
                    border: 3px solid rgb(255, 61, 0);
                }
                div.sticky{
                    position: sticky;
                    top: 1px;
                    left: 20px;
                    width: 100px;
                    border: 3px solid rgb(255, 0, 0);
                }
        </style>
    </head>
<body>
    <h2>Positioning Example</h2>
    <div>
        <p>This is a normal div element.</p>
    </div>
    <div class="sticky">
        <p>This div is positioned sticky.</p>
    </div>    
    <div class="relative">
        <p>This div is positioned relative.</p>
    
    <div class="absolute">
        <p>This div is positioned absolute.</p>
    </div>
    </div>
    <div class="fixed">
        <p>This div is positioned fixed.</p>
    </div>
